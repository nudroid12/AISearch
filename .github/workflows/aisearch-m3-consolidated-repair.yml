name: AISearch M3 Consolidated Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write consistent M3 source
        shell: bash
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/nudroid12/aisearch"
          RES="app/src/main/res"

          mkdir -p \
            "$SRC" \
            "$RES/layout" \
            "$RES/values" \
            "$RES/drawable" \
            "$RES/color"

          rm -f "$RES/drawable/button_text.xml"

          cat > "$SRC/LiveSearchClient.kt" <<'EOF'
          package com.nudroid12.aisearch

          import org.json.JSONObject
          import java.io.BufferedReader
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class WebResult(
              val title: String,
              val url: String,
              val content: String,
              val score: Double
          )

          data class WebSearchBundle(
              val query: String,
              val results: List<WebResult>
          )

          class LiveSearchClient {

              fun search(query: String): WebSearchBundle {
                  val today = SimpleDateFormat(
                      "yyyy-MM-dd",
                      Locale.US
                  ).format(Date())

                  val requestQuery =
                      "Current information as of $today. $query"

                  val connection =
                      URL("https://api.tavily.com/search")
                          .openConnection() as HttpURLConnection

                  connection.requestMethod = "POST"
                  connection.connectTimeout = 12_000
                  connection.readTimeout = 25_000
                  connection.doOutput = true
                  connection.setRequestProperty(
                      "Content-Type",
                      "application/json"
                  )
                  connection.setRequestProperty(
                      "X-Tavily-Access-Mode",
                      "keyless"
                  )

                  val body = JSONObject().apply {
                      put("query", requestQuery)
                      put("search_depth", "basic")
                      put("max_results", 5)
                      put("include_answer", false)
                      put("include_raw_content", false)
                      put("include_images", false)
                      put("auto_parameters", false)
                  }

                  connection.outputStream.use { stream ->
                      stream.write(
                          body.toString().toByteArray(Charsets.UTF_8)
                      )
                  }

                  val status = connection.responseCode
                  val input = if (status in 200..299) {
                      connection.inputStream
                  } else {
                      connection.errorStream
                  }

                  val raw = BufferedReader(input.reader()).use {
                      it.readText()
                  }

                  if (status !in 200..299) {
                      val message = try {
                          JSONObject(raw)
                              .optString("detail")
                              .takeIf { it.isNotBlank() }
                      } catch (_: Exception) {
                          null
                      }

                      throw IllegalStateException(
                          message
                              ?: "Live web search failed: HTTP $status"
                      )
                  }

                  val response = JSONObject(raw)
                  val array = response.optJSONArray("results")
                      ?: throw IllegalStateException(
                          "Live web search returned no results."
                      )

                  val results = buildList {
                      for (index in 0 until array.length()) {
                          val item =
                              array.optJSONObject(index) ?: continue

                          val title =
                              item.optString("title").trim()
                          val url =
                              item.optString("url").trim()
                          val content =
                              item.optString("content").trim()
                          val score =
                              item.optDouble("score", 0.0)

                          if (
                              title.isNotBlank() &&
                              url.startsWith("http") &&
                              content.isNotBlank()
                          ) {
                              add(
                                  WebResult(
                                      title = title,
                                      url = url,
                                      content = content,
                                      score = score
                                  )
                              )
                          }
                      }
                  }

                  if (results.isEmpty()) {
                      throw IllegalStateException(
                          "No usable live web results were found."
                      )
                  }

                  return WebSearchBundle(
                      query = query,
                      results = results
                  )
              }
          }
          EOF

          cat > "$SRC/GroqClient.kt" <<'EOF'
          package com.nudroid12.aisearch

          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class SearchReply(
              val text: String,
              val sourceCount: Int
          )

          class GroqClient {

              fun answer(
                  apiKey: String,
                  searchBundle: WebSearchBundle
              ): SearchReply {
                  val today = SimpleDateFormat(
                      "yyyy-MM-dd",
                      Locale.US
                  ).format(Date())

                  val sourceText = buildString {
                      searchBundle.results.forEachIndexed { index, result ->
                          append("[SOURCE ${index + 1}]\n")
                          append("Title: ${result.title}\n")
                          append("URL: ${result.url}\n")
                          append("Content: ${result.content}\n\n")
                      }
                  }

                  val systemPrompt = """
                      You are AISearch, a concise TV search assistant.
                      Current date: $today.

                      The web search has already been performed for you.

                      STRICT RULES:
                      1. Answer using ONLY the supplied LIVE WEB SOURCES.
                      2. Do not use stored model knowledge to add current facts.
                      3. If the sources do not prove the answer, say:
                         "I cannot confirm this from the current search results."
                      4. For changing facts such as sports squads, office holders,
                         prices, schedules, scores, news and releases, prefer the
                         newest and most authoritative supplied source.
                      5. Never replace current source information with memory.
                      6. Keep the answer easy to read on a television.
                      7. Reply in the user's language.
                      8. End with a short Sources section containing only URLs
                         actually relied on.
                      9. Do not invent URLs or citations.
                  """.trimIndent()

                  val userPrompt = """
                      QUESTION:
                      ${searchBundle.query}

                      LIVE WEB SOURCES:
                      $sourceText
                  """.trimIndent()

                  val body = JSONObject().apply {
                      put("model", "openai/gpt-oss-120b")
                      put(
                          "messages",
                          JSONArray().apply {
                              put(
                                  JSONObject().apply {
                                      put("role", "system")
                                      put("content", systemPrompt)
                                  }
                              )
                              put(
                                  JSONObject().apply {
                                      put("role", "user")
                                      put("content", userPrompt)
                                  }
                              )
                          }
                      )
                      put("temperature", 0.1)
                      put("max_completion_tokens", 900)
                  }

                  return requestWithRetry(
                      apiKey = apiKey,
                      body = body,
                      sourceCount = searchBundle.results.size
                  )
              }

              private fun requestWithRetry(
                  apiKey: String,
                  body: JSONObject,
                  sourceCount: Int
              ): SearchReply {
                  var lastError: Exception? = null

                  repeat(2) { attempt ->
                      try {
                          return requestOnce(
                              apiKey = apiKey,
                              body = body,
                              sourceCount = sourceCount
                          )
                      } catch (error: RetryableGroqException) {
                          lastError = error

                          if (attempt == 0) {
                              Thread.sleep(error.retryAfterMs)
                          }
                      }
                  }

                  throw lastError
                      ?: IllegalStateException("Groq request failed.")
              }

              private fun requestOnce(
                  apiKey: String,
                  body: JSONObject,
                  sourceCount: Int
              ): SearchReply {
                  val connection =
                      URL("https://api.groq.com/openai/v1/chat/completions")
                          .openConnection() as HttpURLConnection

                  connection.requestMethod = "POST"
                  connection.connectTimeout = 12_000
                  connection.readTimeout = 45_000
                  connection.doOutput = true
                  connection.setRequestProperty(
                      "Authorization",
                      "Bearer $apiKey"
                  )
                  connection.setRequestProperty(
                      "Content-Type",
                      "application/json"
                  )

                  connection.outputStream.use { stream ->
                      stream.write(
                          body.toString().toByteArray(Charsets.UTF_8)
                      )
                  }

                  val status = connection.responseCode
                  val input = if (status in 200..299) {
                      connection.inputStream
                  } else {
                      connection.errorStream
                  }

                  val raw = BufferedReader(input.reader()).use {
                      it.readText()
                  }

                  if (status !in 200..299) {
                      val message = try {
                          JSONObject(raw)
                              .optJSONObject("error")
                              ?.optString("message")
                              ?.takeIf { it.isNotBlank() }
                      } catch (_: Exception) {
                          null
                      }

                      if (
                          status == 429 ||
                          status in 500..599
                      ) {
                          val retrySeconds =
                              connection
                                  .getHeaderField("retry-after")
                                  ?.toLongOrNull()
                                  ?.coerceIn(1L, 5L)
                                  ?: 2L

                          throw RetryableGroqException(
                              message
                                  ?: "Groq is temporarily unavailable.",
                              retrySeconds * 1000L
                          )
                      }

                      throw IllegalStateException(
                          message
                              ?: "Groq request failed: HTTP $status"
                      )
                  }

                  val response = JSONObject(raw)
                  val content = response
                      .getJSONArray("choices")
                      .getJSONObject(0)
                      .getJSONObject("message")
                      .optString("content")
                      .trim()

                  if (content.isBlank()) {
                      throw IllegalStateException(
                          "Groq returned an empty answer."
                      )
                  }

                  return SearchReply(
                      text = content,
                      sourceCount = sourceCount
                  )
              }

              private class RetryableGroqException(
                  message: String,
                  val retryAfterMs: Long
              ) : Exception(message)
          }
          EOF

