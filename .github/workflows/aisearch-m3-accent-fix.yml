name: AISearch M3 Accent Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore missing accent color
        shell: bash
        run: |
          set -euo pipefail

          COLORS="app/src/main/res/values/colors.xml"
          test -f "$COLORS"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/res/values/colors.xml")
          text = path.read_text()

          if '<color name="accent">' not in text:
              text = text.replace(
                  '</resources>',
                  '    <color name="accent">#E8EAF0</color>\n</resources>'
              )

          path.write_text(text)
          PY

          grep -q '<color name="accent">' "$COLORS"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build M3 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --console=plain
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AISearch-M3-accent-fixed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/res/values/colors.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix missing M3 accent color [skip ci]"
          git push origin HEAD:main
