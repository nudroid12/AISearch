      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build M3 consolidated APK
        shell: bash
        run: |
          set +e

          gradle :app:assembleDebug \
            --stacktrace \
            --console=plain \
            > m3-build.log 2>&1

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("m3-build.log").read_text(
              encoding="utf-8",
              errors="replace"
          )
          lines = text.splitlines()

          patterns = [
              re.compile(r"\berror:", re.I),
              re.compile(r"\be:", re.I),
              re.compile(r"FAILURE:", re.I),
              re.compile(r"What went wrong", re.I),
              re.compile(r"Execution failed for task", re.I),
              re.compile(r"Compilation error", re.I),
              re.compile(r"resource .* not found", re.I),
              re.compile(r"Unresolved reference", re.I),
              re.compile(r"Caused by:", re.I),
          ]

          blocks = []
          seen = set()

          for index, line in enumerate(lines):
              if any(pattern.search(line) for pattern in patterns):
                  start = max(0, index - 3)
                  end = min(len(lines), index + 8)
                  block = "\n".join(lines[start:end]).strip()

                  if block and block not in seen:
                      seen.add(block)
                      blocks.append(block)

          summary = (
              "\n\n---\n\n".join(blocks[:20])
              if blocks
              else "\n".join(lines[-200:])
          )

          Path("m3-error-summary.txt").write_text(
              summary + "\n",
              encoding="utf-8"
          )
          PY

            cat m3-error-summary.txt
            exit "$STATUS"
          fi

          cat m3-build.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload M3 APK
        uses: actions/upload-artifact@v4
        with:
          name: AISearch-M3-consolidated-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload error summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AISearch-M3-error-summary
          path: m3-error-summary.txt
          if-no-files-found: ignore

